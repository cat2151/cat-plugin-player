[package]
name = "cat-plugin-player"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Pinned: this is the eframe API the code below was written against.
eframe = "0.31"
# Audio output (WASAPI on Windows).
cpal = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.6", features = ["derive"] }
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", package = "cat-self-update-lib" }
libloading = "0.8"
sha2 = "0.10"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png"] }
