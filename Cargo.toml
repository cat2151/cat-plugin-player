[package]
name = "cat-plugin-player"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Pinned: this is the eframe API the code below was written against.
eframe = "0.31"
# The same handle API implemented by eframe CreationContext.
raw-window-handle = "0.6"
# Audio output (WASAPI on Windows).
cpal = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
libloading = "0.8"
sha2 = "0.10"
quick-xml = "0.41"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Shared catalog reader and patch preparation from sibling checkouts (ADR 0012).
clap-mml-render-tui = { path = "../clap-mml-render-tui/app" }
cmrt-patches = { path = "../clap-mml-render-tui/patches" }
cmrt-chord = { path = "../clap-mml-render-tui/chord" }
cmrt-core = { path = "../clap-mml-play-server/core-lib" }
cmrt-patch-select = { path = "../clap-mml-render-tui/patch-select" }
cmrt-tui-core = { path = "../clap-mml-render-tui/tui-core" }
rand = "0.8"

[patch."https://github.com/cat2151/clap-mml-play-server"]
cmrt-core = { path = "../clap-mml-play-server/core-lib" }
cmrt-server-config = { path = "../clap-mml-play-server/server-config" }
